<style>
:root{
  --paper:#f4ecd8; --ink:#241c14; --soft:#6b5d49; --line:#cbb894;
  --accent:#7a6a4f; --plate:#ece0c6; --display:'Cinzel'; --name:'Cormorant Garamond';
  --body:'EB Garamond'; --mono:'JetBrains Mono';
}
/* ---- SKINS: same data + same template, different presentation layer ---- */
html[data-skin="illuminated"]{--paper:#f4ecd8;--ink:#241c14;--soft:#6b5d49;--line:#cbb894;--plate:#ece0c6;--display:'Cinzel';--name:'Cormorant Garamond';--body:'EB Garamond';--dropcap:1;}
html[data-skin="fieldguide"]{--paper:#faf8f3;--ink:#1f2421;--soft:#5d6b62;--line:#d6dcd2;--plate:#eef1ea;--display:'Spectral';--name:'Spectral';--body:'Spectral';--dropcap:0;}
html[data-skin="obsidian"]{--paper:#15130f;--ink:#ece3d2;--soft:#9a8c74;--line:#3a3326;--plate:#1d1a14;--display:'Cinzel';--name:'Cormorant Garamond';--body:'EB Garamond';--dropcap:1;}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body),serif;line-height:1.62;
  transition:background .4s ease,color .4s ease;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(circle at 20% 10%, rgba(0,0,0,.04), transparent 40%),
             radial-gradient(circle at 90% 80%, rgba(0,0,0,.05), transparent 45%);}

/* ---- screen control bar (hidden in print) ---- */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
  padding:.7rem 1.2rem;background:rgba(20,16,10,.92);backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:.72rem;color:#e8dcc4;letter-spacing:.02em;}
.bar b{color:#e3b864;font-weight:500}
.bar .grow{flex:1 1 auto}
.bar button{font-family:var(--mono);font-size:.7rem;padding:.42rem .8rem;border:1px solid #5a4d36;
  background:#231d14;color:#e8dcc4;border-radius:3px;cursor:pointer;letter-spacing:.04em;transition:.18s}
.bar button:hover{background:#3a3122;border-color:#8a7752}
.bar button.on{background:#e3b864;color:#231d14;border-color:#e3b864;font-weight:500}
.bar .print{margin-left:.3rem;background:#3a5a3a;border-color:#3a5a3a}
.bar .print:hover{background:#4d734d}

.page{max-width:7.2in;margin:0 auto;padding:0 .65in;position:relative;z-index:1}

/* ---- front matter ---- */
.front{text-align:center;padding:3.2rem 0 2rem}
.front .series{font-family:var(--display);font-weight:600;letter-spacing:.42em;font-size:.82rem;
  color:var(--soft);text-indent:.42em}
.front .codex{font-family:var(--display);font-weight:500;letter-spacing:.3em;font-size:1rem;margin:.3rem 0 1.4rem;color:var(--soft)}
.front h1{font-family:var(--name);font-weight:600;font-size:2.9rem;line-height:1.08;letter-spacing:.01em}
.front .sub{font-style:italic;color:var(--soft);margin-top:.6rem;font-size:1.05rem}
.front .date{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;color:var(--soft);margin-top:1.1rem}
.front .epi{max-width:30rem;margin:2.2rem auto 0;font-style:italic;color:var(--ink);font-size:1.06rem}
.front .epi cite{display:block;font-style:normal;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--soft);margin-top:.7rem}
.rule{width:42%;margin:1.6rem auto;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);border:0}

/* ---- prose section (Foundational Principles) ---- */
.section-prose{padding:1.5rem 0}
.sec-head{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;
  text-align:center;color:var(--ink);margin:1rem 0 .4rem}
.sec-prose h3{font-family:var(--name);font-weight:600;font-size:1.4rem;margin:1.5rem 0 .4rem;color:var(--ink)}
.sec-prose p{margin:.6rem 0;text-align:justify;hyphens:auto}
.sec-prose p.lede{border-left:2px solid var(--accent);padding-left:.9rem}

/* ---- realm divider ---- */
.realm-divider{text-align:center;padding:3rem 0 1.6rem;page-break-before:always;break-before:page}
.realm-divider .kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.34em;color:var(--accent)}
.realm-divider h2{font-family:var(--display);font-weight:700;font-size:3.1rem;letter-spacing:.16em;
  text-transform:uppercase;margin:.5rem 0;color:var(--ink)}
.realm-divider .roots{font-style:italic;color:var(--soft);font-size:.98rem}
.realm-divider .glyph{font-size:1.4rem;color:var(--accent);margin:.8rem 0}

/* ---- category band ---- */
.cat{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;
  color:var(--accent);margin:2.2rem 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.7rem}
.cat::before{content:"";width:.45rem;height:.45rem;background:var(--accent);transform:rotate(45deg);flex:none}

/* ---- THE TEMPLATE: one creature entry ---- */
.creature{margin:0 0 2.4rem;page-break-inside:avoid;break-inside:avoid;position:relative}
.plate{aspect-ratio:3/2;background:var(--plate);border:1px solid var(--line);border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1rem;
  position:relative;overflow:hidden}
.plate::after{content:"";position:absolute;inset:.32rem;border:1px solid var(--line);opacity:.5;border-radius:1px}
.plate .ph{font-family:var(--mono);font-size:.64rem;letter-spacing:.28em;color:var(--soft);text-transform:uppercase}
.plate .pn{font-family:var(--name);font-style:italic;font-size:1.5rem;color:var(--soft);opacity:.75}
.creature h4{font-family:var(--name);font-weight:600;font-size:2rem;line-height:1.05;color:var(--ink)}
.creature .epithet{font-family:var(--name);font-style:italic;font-weight:500;font-size:1.15rem;color:var(--accent);margin-top:.1rem}
.etym{font-family:var(--mono);font-size:.74rem;color:var(--soft);margin:.55rem 0 .9rem;padding:.5rem .7rem;
  background:color-mix(in srgb,var(--accent) 8%, transparent);border-left:2px solid var(--accent);line-height:1.5}
.etym .pron{color:var(--ink);font-weight:500}
.creature .desc p{margin:.55rem 0;text-align:justify;hyphens:auto}
html[data-skin] .creature .desc p:first-child:first-letter{}
body[data-cap="1"] .creature .desc p:first-child::first-letter{
  font-family:var(--display);font-weight:700;font-size:3.1rem;line-height:.8;float:left;
  padding:.1rem .5rem .1rem 0;color:var(--accent)}

footer{text-align:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--soft);
  padding:2.5rem 0 3rem}

/* ---- PRINT: real book output ---- */
@media print{
  @page{size:7.5in 9.25in;margin:.6in .7in;}
  .bar{display:none!important}
  body::before{display:none}
  body{background:#fff;color:#000}
  html[data-skin]{--paper:#fff;--ink:#1a1a1a;--plate:#f2f2f2;--line:#cccccc}
  .page{max-width:none;padding:0}
  .creature,.realm-divider{break-inside:avoid}
}

<script>
const DATA = {"front": [], "sections": [{"label": "Advent Of Ultima", "raw": "ADVENT OF ULTIMA", "type": "prose", "roots": "", "categories": [], "blocks": [], "intro": ["MOIRAI CODEX"]}, {"label": "Nature & Wildlife Of The Realms", "raw": "NATURE & WILDLIFE OF THE REALMS", "type": "prose", "roots": "", "categories": [], "blocks": [], "intro": ["A Comprehensive Reference", "March 2026", "The animals and wildlife and even the Gonlan seem to be in mourning — but for what?", "— The State of the Realms at the Opening of Book One"]}, {"label": "Foundational Principles", "raw": "I. FOUNDATIONAL PRINCIPLES", "type": "prose", "roots": "", "categories": [], "blocks": [{"heading": "The Elemental Rule", "paragraphs": ["Every Realm’s fauna is shaped by its governing divine element. The element functions as the foundational environmental pressure — the equivalent of sunlight in a terrestrial food chain. Each Realm’s biological baseline is distinct enough that a creature native to one Realm could never be mistaken for one from another.", "Pyrthera: Everything is enormous and adapted to extreme heat. No normal animals. Seven suns means the food chain never got pruned.", "Ferridane: Every native animal is crystal-integrated, Vital Current charged, and soma-woven by default. Animal magic expresses exclusively as electricity, flame, or wind. No naming ability. The Sacred Arts are biomimicry — the clans named themselves after the beasts.", "Thalassor: Wildlife glows blue or bluish and is more intelligent than it should be. The Krenides water has been in the food chain since before civilization.", "Zephyros: All wildlife is peaceful and herbivorous. Some can talk or seem able to. Ecology evolved in the presence of Aether and the total absence of violence.", "Tenebralis: The entire ecology operates on one principle: what knows you can eat you. Be unknowable."]}, {"heading": "The Dragon Spectrum", "paragraphs": ["Dragons are the bird equivalent across all Realms. The size range is continuous: from palm-sized Chanteliers on Zephyrosian rooftops to atmospheric Gonlans indistinguishable from weather. On Ferridane, any dragon up to vulture-sized is classified as an Axipter; anything larger is properly a dragon. Every Gonlan is a child of Aracice, the Star-Eater. Alciel Aquilon Karai is the half-sibling of every Gonlan alive."]}, {"heading": "Creatures and Terrae", "paragraphs": ["Animals wander through Clairgates because Clairgates are doors. Additionally, Mystics have retired on Terrae throughout history and told stories. A Ferridanian veteran in ancient Greece describing the Vastas is the origin of the minotaur legend. The creatures are the originals. The legends are the copies."]}, {"heading": "Clairgate Trackers and Wildlife Divisions", "paragraphs": ["Thalassor maintains fully staffed Tracker and Wildlife divisions responsible for managing creatures that wander through the Clairgate network. Given the intelligence and danger level of many species across the Realms, this is considered prestigious and demanding work — well-funded, well-trained, and never short of assignments. The divisions maintain a comprehensive bestiary cataloging every species that has ever come through a gate, cross-referenced by realm of origin, threat level, and incident history."]}]}, {"label": "Zephyros", "raw": "II. ZEPHYROS", "type": "realm", "roots": "Linguistic roots: French, Latin, Frankish/Germanic.", "categories": [{"name": "Between Animal And Human", "creatures": [{"name": "Belviper", "epithet": "The Gorgons", "pronunciation": "bel-VY-per", "etymology": "French belle + vipère, “beautiful serpent”", "paragraphs": ["A lady-sized serpentine creature with a face that reads as human-adjacent — striking bone structure and proportions that register as beautiful even across species lines. Vertical slit pupils that do not track like a person’s. No eye contact behavior, no speech, no human prosocial instincts. Serpentine tendrils in place of hair move constantly and independently, tasting the air or sensing vibration. She may produce clicks, hisses, or low resonant sounds, but these are not language and are not directed at observers.", "The Belviper is an animal with a humanoid face, not a person with animal features. She wanders into Zephyrosian towns the way a bear wanders into a campground — not hostile, not visiting, just moving through space that happens to overlap with yours. She investigates market stalls, picks up objects, examines children with flat, complete, unreadable attention, and moves on when bored. Every person in the vicinity holds very still, because her defining biological trait is a Birth Domain Deusa: crystallization.", "Under stress or by reflex, the Belviper’s gaze converts living tissue to crystal. This is permanent, irreversible, and tantamount to death. The crystallized person is gone. The Belviper does not orient her emotional life around this fact. An accidental crystallization elicits something equivalent to “oops.” She has no more grief about it than a person who accidentally runs over a squirrel. It is a defense mechanism, and she is an animal that possesses it, and that is the whole of it.", "Zephyrosian towns kindly ask visiting Belvipers to put on sunglasses, or at least a hat. The Belviper generally complies because she finds the custom amusing and does not mind. She does not understand why humans are frightened. She also does not care, because their fear is their problem. There are places in the deep forests where circles of crystal figures stand in clearings, perfectly preserved. These are graves.", "Over the course of nine books, one notably intelligent Belviper learns something like communication. She collects shiny things, interesting flowers, and tiny hats for her snake-hair. She is the exception, remarkable precisely because no other Belviper has ever done this."]}]}, {"name": "Social Creatures", "creatures": [{"name": "Flambelin", "epithet": "The Hearthfoxes", "pronunciation": "FLAM-beh-lin", "etymology": "French flambe + Germanic -lin, “little flames”", "paragraphs": ["Elemental kitsune. Small, mischievous, universally beloved. They steal small things and bring back different small things. They start tiny fires for no reason and look enormously pleased with themselves. They curl up at the foot of a person’s bed and shift element with their mood — warm when content, crackling with static when excited, cool and misty when sleepy. They are not useful. They are not sacred. They are delightful, and everyone wants one."]}, {"name": "Graindoux", "epithet": "The Seed-Collectors", "pronunciation": "gran-DOO", "etymology": "French graine + doux, “sweet seed-gatherers”", "paragraphs": ["Mouse-like creatures found in every ecosystem on Zephyros — plains, forests, crystal isles. They collect seeds with apparent deliberate intent and redistribute them in patterns that suggest gardening. Nobody has confirmed this. The Oracles smile when asked, which on Zephyros constitutes evidence."]}]}, {"name": "Neutral Creatures", "creatures": [{"name": "Chanteliers", "epithet": "The Birdsong Dragons", "pronunciation": "shahn-teh-LYEHR", "etymology": "French chanter + l’air, “air-singers”", "paragraphs": ["The baseline of the dragon class. Bird-sized dragons that perch on rooftops and wheel through the sky in flocks that catch the Aetheric shimmer. Their vocalizations are melodic, layered, and responsive to each other in patterns that may be conversation or music — the distinction may not matter on Zephyros. They are the sparrows of this world, the ambient wildlife, the thing you stop noticing until a morning comes when they are quiet and the silence feels wrong."]}, {"name": "Voiceleste", "epithet": "The Singing Dragons", "pronunciation": "vwah-seh-LEST", "etymology": "French voix + Latin caelestis, “heavenly voices”", "paragraphs": ["Larger dragons that drift through the upper air currents, singing with voices that carry for miles. They are not communicating in the functional sense; the song is simply what they do, the way wind makes sound passing through a canyon. The Crystal Isles’ choral culture did not develop in silence. It developed under a sky that was already singing."]}]}, {"name": "Mythic Creatures", "creatures": [{"name": "The Dreaming Woods", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["The forests of Zephyros move. Not often, not far, but a clearing you knew will be different when you return. The trees rearrange themselves in response to shifts in the Aether, to conversations at frequencies below hearing. The Oracles say the trees are dreaming, and when they dream, they walk. They have never walked toward anyone. They walk toward sunlight, toward water, toward each other. Settlements at the forest’s edge have been gently, inexorably nudged aside over generations. The Zephyrosians do not fight this. They move the village. When a forest moves, it moves with the slow unstoppable force of a glacier."]}, {"name": "Aeralithe", "epithet": "Gonlan of the Upper Atmosphere", "pronunciation": "", "etymology": "", "paragraphs": ["Child of Aracice and Iles. Lives above the stratosphere. Indistinguishable from weather at its scale. Its movements cause eclipses, storms, and weather events. A brutal winter means Aeralithe has moved on. The Aetheric particles visible on the highest peaks — yellow-green myst drifting downward like luminous snow — are shed from Aeralithe’s scales. Only Algol has seen Aeralithe in its entirety, from its back. The Zephyrosian eschatological promise — the Carrying — holds that Aeralithe will descend and carry the faithful to the next world."]}, {"name": "Xal-Uron", "epithet": "Gonlan of the Storm Layer", "pronunciation": "", "etymology": "", "paragraphs": ["Black, streaked with gold, serpentine. If you see Xal-Uron, it is blotting out the entire visible sky. Lives among the stormclouds of Uronoia. Arranges the raw Aetheric energy shed by Aeralithe into lightning, including Fulguror, the golden lightning that enforces divine law. The Stormcallers of Uronoia practice an echo of an echo of an echo of Xal-Uron’s work. The monks walk into storms seeking communion. Xal-Uron is the realm’s first line of defense. Together with Aeralithe, the two form a divine cascade: Aeralithe generates raw energy; Xal-Uron channels it into enforceable power."]}]}], "blocks": []}, {"label": "Ferridane", "raw": "III. FERRIDANE", "type": "realm", "roots": "Linguistic roots: Latin.", "categories": [{"name": "Between Animal And Human", "creatures": [{"name": "Sagittans", "epithet": "The Centaurs", "pronunciation": "sah-GIT-tahns", "etymology": "Latin sagittarius, “archer”", "paragraphs": ["A species that appears to be evolving toward humanoid sapience. Intelligent, powerful, and strangely civilized. Crystal-integrated and Vital Current charged in a wild, untrained way — swifter and smarter than you want them to be. Organized in formations and strategies that do not follow any Ferridanian military doctrine. Very adept at ranged combat with spears and bows. Likely to spit fire at close range.", "Sagittans are territorial and want to be left alone. Their weapons mark a border, not aggression. A patrol that approaches gets one warning. A civilization that fights everything, that considers war a philosophy and pressure a sacrament, looked at the Sagittans and decided to leave them be. That assessment was paid for in Ferridanian casualties during early contact.", "Their wild magic is what makes them truly dangerous. Ferridanian Mystics train their Vital Current use through academies and institutional frameworks. The Sagittans never attended an academy. Their Current use developed along entirely independent lines, producing abilities that trained Mystics cannot predict or model. No comfortable engagement range exists: at distance, they shoot you; up close, they burn you; in between, they are faster than you, so they choose which option you receive.", "The Hero’s Journey route specifically skirts Sagittan territory — close enough to see boundary markers, far enough that nobody crosses. Every few years, an overconfident contestant takes a shortcut through Sagittan land. The race organizers do not go looking for them."]}, {"name": "Vastas", "epithet": "The Minotaurs", "pronunciation": "VAHS-tahs", "etymology": "Latin vastare, “to lay waste”", "paragraphs": ["A hybridized species — something bovine and something humanoid, merged at some point in Ferridane’s deep or recent past. The result possesses just enough intelligence to be cruel but not enough to be reasoned with. They manufacture crude weapons. They establish camps with rudimentary social hierarchy. They take women. They eat things that frighten most men. Orc-like in nature — organized enough to constitute a persistent threat, not organized enough to form a political entity.", "The Ferridanian military treats Vastas as an infestation that cannot be fully cleared because the Outlands are too vast and the Vastas breed in the spaces between patrols. Every generation of Ferridanian soldiers has Vastas stories. None of them are good stories.", "The Hero’s Journey does not deliberately route through Vastas territory. However, the Vastas deliberately migrate toward the path when the Midway Banquet is being established. They are smart enough to recognize the annual pattern: a long trail of individual humans walking through the Outlands, converging on a massive gathering of food, drink, and people. The perimeter security at the Midway Banquet is not ceremonial — it is a genuine military deployment to keep the Vastas at bay while contestants feast. Some years the migration is light and manageable. Some years it is heavy and the contestant casualty count spikes. The Journey continues regardless, because the danger is the point."]}]}, {"name": "Predators", "creatures": [{"name": "Felicis", "epithet": "The Great Cats", "pronunciation": "", "etymology": "", "paragraphs": ["The apex predator of the central plains. Crystal-integrated and soma-woven, with a mane of living flame and lightning — a corona of gold and white fire crackling with arcs of electricity that extends the kill radius well beyond the animal’s physical body. The spectrum of Felicis runs from the recognizable lion silhouette with crystalline growths and a burning mane to, at the extreme end of crystal saturation, a creature made entirely of crystallized fire.", "The Felidae clan saw the Felicis and named themselves after it. Not the other way around. The entire Felidae identity — the golden lion aesthetic, the synthesis of power, the aspiration to apex dominance — is an attempt to become what the Felicis already is. A Felicis silhouetted on a ridge at dusk, its mane blazing against the sky, is the most beautiful and terrifying thing most Ferridanians will ever see. It is the reason an entire clan exists."]}, {"name": "Lykons", "epithet": "The Wolves", "pronunciation": "", "etymology": "", "paragraphs": ["Pack hunters of the northern ranges and Outlands. Crystal-integrated along the spine, skull, and joints, capable of discharging concussive electrical bursts from crystal nodes. The spectrum runs from conventional crystal-spined wolves to, at extreme saturation, creatures made entirely of crystallized lightning.", "The defining feature is the howl. When a Lykon pack howls, the sound travels not just through air but through the crystal lattice in the bedrock. You feel it in your bones before you hear it with your ears. The Old Lykaion monks in their mountain temples feel the wolves singing through the stone and sing back. This is the origin of the communion between the Lykaion clan and the wolf — call and response, not domestication. The wolves sang first. The people answered. The Lykaion named themselves after the Lykons."]}, {"name": "Axipters", "epithet": "The Raptors", "pronunciation": "", "etymology": "", "paragraphs": ["Crystal-laced feathered dragons up to vulture-sized. Anything larger than vulture-scale is classified as a proper dragon by Ferridanian standards. Their crystal integration allows them to perceive the Vital Current the way some terrestrial birds perceive magnetic fields. They navigate by energy flow and can detect disruptions in the Myst-Grid before instruments register the fault.", "The Axipitre clan named themselves after the Axipters. An Axipitre engineer who bonds with an Axipter gains a creature that feels where the Current runs strong, where it is disrupted, where something has gone wrong — the raptor turns its head toward the problem before anyone else knows it exists. The relationship is collaborative: two species that both understand the Current, working together because both are better for it."]}, {"name": "The Bull-Creatures", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Massive, solitary, territorial. Crystal horns channel the Vital Current, making a direct charge not merely physically devastating but magically disruptive. They do not bluff. A bull-creature that lowers its head at you is communicating with perfect clarity what is about to happen, extending you the courtesy of a warning it is not obligated to give. The Ferridanian cultural respect for directness and honest combat may trace back to this animal. It never lied to you. It showed you what it was and then it was that thing."]}, {"name": "The Chimera", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Creatures where multiple crystal types have fused into a single organism, producing compound Vital Current abilities that are unpredictable and unique. No two chimera are alike. They represent the apex of the Outlands ecology and are present along the Hero’s Journey route as natural obstacles. Each one has a territory, a pattern, and a life; contestants pass through, they do not exterminate."]}]}, {"name": "Neutral And Food Animals", "creatures": [{"name": "The Stags", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Crystal antler growths that catch forge-light and refract it into prismatic patterns across the ground. Herds moving through a valley at sunset look like the land itself is glittering. Children collect shed crystal fragments from the antler-molt the way Earth children collect interesting rocks. Some fragments still hold a faint charge — a child puts one under their pillow and it hums warm through the night."]}, {"name": "Livestock", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Crystal-integrated herbivores that graze on mineral-rich vegetation and develop crystata deposits over their lifetimes. Ranching on Ferridane is simultaneously agriculture and mining. The meat feeds the family; the crystals sell at market."]}]}, {"name": "Mythic Creatures", "creatures": [{"name": "Bahamut", "epithet": "The Diamond Gonlan", "pronunciation": "", "etymology": "", "paragraphs": ["The Gonlan of Ferridane. A being of immense power whose existence was co-opted by the Godmind project — installed in the Atrium of Steelheart with Crex’s stolen God-Eyes (Deusaex-Wizaer) set into its skull. Uriel burned the Atrium to retrieve the eyes, exposing the Godmind project to the entire Realm via the Nexus. Aurelius Vorn did not know about Bahamut and now sees the scale of the betrayal behind his back."]}, {"name": "The Steel Menagerie", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Axipitre-built autonomous constructs in heraldic beast forms — wolves, hawks, lions — Awakened with the Vital Current via the Art of Transfusion. Not fauna. Engineering. But modeled directly on the real animals and animated by the same Current those animals channel naturally."]}]}], "blocks": []}, {"label": "Thalassor", "raw": "IV. THALASSOR", "type": "realm", "roots": "Linguistic roots: Greek and Latin.", "categories": [{"name": "Between Animal And Human", "creatures": [{"name": "The Sirens", "epithet": "Two Races", "pronunciation": "", "etymology": "", "paragraphs": ["Fully sapient. Ancient. They maintain their own civilization beneath the waves, entirely independent of Thalassan Mystic society. They coexist with the vast and dangerous things in the deep ocean. Mysterious and romanticized by surface-dwellers. The Thalassans have always known about them — the Sirens are a fact of life, not a recent discovery.", "The Sea-Sirens", "The classical silhouette: humanoid from the waist up, aquatic from the waist down. They do not walk ashore. They lounge on coastal rocks and shoreline, sunning themselves and singing. They are passive in method — they do not chase, do not pursue, do not come to you. They exist on the rock, beautiful and singing, and the fisherman steers closer because he cannot help it, and then he is in the water, and then he is gone. The Sea-Siren never moved. She did not have to.", "Sometimes they come to the shores and try to steal women’s husbands — or at least that is what the husbands say. Sometimes they succeed. The man never returns. Whatever exists beneath the waves, wherever the Siren civilization is, it is a one-way door. Whether the taken cannot return, do not want to return, or are no longer alive is unknown. The mystery is the point.", "The Sky-Sirens", "Bird body with a woman’s head. Commonly mistaken for harpies. Will claw your eyes out for it. The distinction is not academic to them: harpies in myth are filthy, punishing, monstrous. The Sky-Sirens are proud, fully sapient, and aware that surface cultures have been telling degrading stories about them for centuries. Making the mistake to their face produces immediate and violent correction.", "These are the ones who come inland. They are not polite about it. If a Sky-Siren took your husband, she descended from the sky with talons and wings and snatched him and carried him to a cave. That is not seduction. That is abduction.", "Relations with Thalassan Civilization", "The relationship varies by continent. Amphitra — old world, maritime, built into the water — has the oldest and most practical working relationship with the Sirens, built on generations of coexistence. Salacica — new world, cosmopolitan, built on top of the water — is more distant and formal. The Isles suffer the worst of it: the Sirens are their bane. Sea-Sirens claim reefs and redirect fish schools. Sky-Sirens take livestock, take catches from drying racks, and nest on every available cliff. The islanders live with it the way coastal villages live with hurricanes — it is the price of being there."]}]}, {"name": "Social Creatures", "creatures": [{"name": "Katos", "epithet": "The Not-Cats", "pronunciation": "KAH-tohs", "etymology": "Greek gatos, “cat”", "paragraphs": ["Small, blue-glowing, hyper-intelligent creatures that maintain their own parallel society within Thalassor. They are not pets. They are not domesticated. They come and go like friends, on their own terms, for their own reasons.", "A Katos typically arrives in a person’s life around age eleven. It watches for a while — weeks, sometimes longer — and decides the person is interesting, or good, or worth its time. It starts showing up: windowsill in the morning, following at a distance, and then one day it is inside, asleep on the bed, glowing faintly in the dark. The person’s mother says “oh, you’ve got one now” like it is a rite of passage, because it is. Some stay for life. Some visit multiple households daily. Some disappear for a year and return without explanation. When one dies, the grief is real and widely understood. There are Thalassan poems about it.", "Some Katos set up shops — small, tucked into market corners, in spaces too small for humanoid vendors. They trade in trinkets, charms, curiosities, and things that fell off the back of a cart. Half of them are fences. The operation is conducted with such charm and brazenness that even the authorities find it difficult to be angry. A Sinclair tax collector confronting a glowing blue creature sitting on a pile of clearly stolen jewelry, being stared at with absolute innocence and faint condescension — that is a Tuesday.", "Their mischief genuinely bothers a certain type of person. But while it is as common to dislike them as to love them, you are considered kind of an asshole if you hate them. If a tax collector tries to confront one and the cuteness does not work, it runs off and comes back with ten friends. They sometimes steal things for their chosen people, but never upon request. It is hard to get a Katos to do anything upon request.", "The old Katos — the ones alive for generations — are different. Quieter. They sit in gardens of old estates watching the harbor. They remember things nobody else remembers. Occasionally a historian sits with one and the creature does something — touches a specific object, leads them to a specific place — that reveals information lost for centuries. They are not oracles. They do not perform. But they know things, and sometimes, if they like you, they share."]}]}, {"name": "Predators", "creatures": [{"name": "The Lantern", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["A deep-water predator whose bioluminescence precisely mimics the glow of Krenides springs — the sacred healing waters of Thalassor. Prey is lured toward what appears to be a healing source. It is not. The Lantern exploits the single thing every creature in Thalassor’s ocean instinctively moves toward."]}]}, {"name": "Neutral Creatures", "creatures": [{"name": "The Court", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["A phenomenon observed in the deep ocean: hundreds of luminous creatures arranging themselves in precise geometric patterns on the ocean floor, visible from the surface on clear nights. Whether this is communication, worship, governance, or something with no humanoid analogue is unknown. The resemblance to the Synedrion — the Thalassan ruling council — has not gone unnoticed by observers. Some marine scholars argue that the Court predates the Synedrion and may have been the model for it."]}, {"name": "General Marine Life", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Bioluminescent, blue-glowing, coordinated beyond instinct. Schools of luminous fish rearrange themselves into shapes that may be meaningful. Fishermen have generations of superstitions about the patterns. Some of those superstitions are not superstitions."]}]}, {"name": "Mythic Creatures", "creatures": [{"name": "Archon", "epithet": "The Great Sea Serpent", "pronunciation": "AR-kon", "etymology": "Greek archon, “ruler”", "paragraphs": ["Ancient beyond reckoning. Vast. Glowing blue-white in the deep. The extreme upper end of Thalassan marine intelligence — something that has been drinking Krenides-saturated water since before the Sinclairs held the gates.", "Sailors who encounter Archon do not describe a monster. They describe a presence: something vast moving beneath the hull and the overwhelming feeling of being regarded, assessed, and judged by a mind that operates on a timescale incompatible with human cognition. Most encounters end with nothing happening. Archon looked. Archon decided. The ship passed. But sailors who have been assessed say it changes you — not magically, but the way any encounter with something that vast and knowing changes a person. You come back quieter. You look at the water differently.", "Children on the coast sometimes see the glow far out, moving slowly. They wave. Their parents tell them not to. They wave anyway. Sometimes — and this might be a story, but the children believe it — the glow pauses. Just for a moment."]}, {"name": "Hydralithe", "epithet": "The Gonlan of Thalassor", "pronunciation": "", "etymology": "", "paragraphs": ["A Hydra the size of a moon. Alciel gained its form during his imprisonment in Hel. The form he almost used to drown Ferridane."]}]}], "blocks": []}, {"label": "Pyrthera", "raw": "V. PYRTHERA", "type": "realm", "roots": "Linguistic roots: Latin, Egyptian, Greek.", "categories": [{"name": "Between Animal And Human", "creatures": [{"name": "The Androsphinx", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["The original dominant species of Pyrthera. A colossal, leonine being: head of a lion, everything from the neck down built like a bodybuilder four meters tall. Fully sapient — capable of language, relationship, memory, and the bearing of civilizational responsibility. The Androsphinx were there before humanoid civilization arrived on Pyrthera. The two species chose coexistence, and the Androsphinx participated in Pyrtheran society not as subjects or symbols but as elders.", "The species is now functionally extinct. Whether they dwindled through slow reproductive failure, through the vast timescale of their individual lives outpacing generational replacement, or through some other cause is not recorded. One remains.", "Tein-Enhotep — The Trialkeeper", "Supposedly the last Androsphinx. One of Aracice’s oldest friends. Alciel’s uncle — not biologically (Alciel’s parents are Aracice and Nyx), but in every way that matters. The word a child uses for his father’s closest companion, the one who was there before the child existed, who knew the father before he was a parent.", "Physical description: four meters tall, leonine head, body covered in golden brands that record not just his personal history but the history of Pyrtheran civilization. Every brand is a name — every person he watched live and then watched die or ascend. He carries a sunstone blade the size of most doors. His mane is smoldering black fire. His eyes are burning coals. His voice is rolling thunder. His footsteps quake the ground. He could hold a grown man in the palm of his hand.", "He is humorless. Completely. Alciel plays off it sometimes.", "He was once Exvisar of Pyrthera, long ago. Sol’Kheret has something like a deferential relationship with him — he was the standard for Pyrtheran civilization long before her grandparents’ grandparents were powerful enough to hold power. He thinks she is a bit rambunctious. Chalks it up to youth.", "He has watched his entire species die. A friend is another brand. Grief passes more easily now. He would rather carry honor for the fallen than be seen to grieve.", "He helped raise and train Alciel in the discipline of the martial. The way Alciel fights — the preference for fists, the honesty of the punch, the philosophy that a bullet does not carry the message that the beating is personal — some of that comes from Tein-Enhotep. He participates in the Battle of Point Zero, where his oldest friend dies. He goes ahead of Alciel to Zephyros and prepares the audience with the Oracles. He stands beside Alciel, always. Like a godfather. Like a bodyguard. Like a first knight. Like an uncle. He is not there because Alciel requires protection. He is there because he promised a dead friend he would look after the boy."]}]}, {"name": "Predators", "creatures": [{"name": "The Apex Predators", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Solar-adapted reptilian creatures of enormous scale — organisms tuned to an extreme solar environment over millennia, operating as apex predators in a furnace ecosystem. Fast enough and strong enough to bring down the megafauna herbivores, which means fast enough and strong enough to kill anything that exists. Heat-resistant hides, solar-absorptive biology, metabolic speeds that non-Pyrtherans cannot track.", "They are beautiful. Terrifyingly, heartbreakingly beautiful. A Pyrtheran apex predator cresting a dune at sunrise with seven suns behind it, its solar-absorptive hide blazing with refracted light, is not a threat assessment. It is a religious experience. Pyrtherans hunt these things and also revere them.", "The Khetian hunt is simultaneously sacred, sporting, commercial, and sometimes fatal. Some hunters go out with reverence and return with food for the settlement. Some go out because they want the glory — to be the one who took down the big one, the one whose kill becomes the armor they wear. There are always guys who do it for the glory. There are always guys who get eaten. Someone at the feast says he always did think he was faster than he was, and everyone drinks to him, and life goes on. Pyrthera does not moralize about the ones who die. The trial gave its answer."]}]}, {"name": "Social Creatures", "creatures": [{"name": "The Hunting Companions", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Solar-adapted reptilian predators, roughly horse-sized. Bonded to families across generations, passed down the way a sword is passed down elsewhere. The companion sleeps against the side of the house, and its body temperature keeps the walls warm through cold desert nights. The children grow up climbing on it. It lets them. When a family’s companion dies, the loss is generational — the animal that kept the house warm, that the grandparents rode, that the children climbed. The next one, if there is one, is not a replacement. It is a new relationship."]}]}, {"name": "Neutral And Food Animals", "creatures": [{"name": "The Megafauna Herbivores", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Sauropod-scale, solar-fed, migratory. They follow routes older than any settlement, moving with the slow grandeur of something that has never in its evolutionary history needed to hurry. Solar-absorptive hides blaze with refracted light at sunrise. Some are known individually by nearby settlements — named the way you name a mountain, watched for every season. Children climb ridges to see the great ones pass. If one year a known individual did not come through her canyon, the settlement would mourn.", "Pyrtherans use every part of the animal. Not as efficiency — as honor. The solar-charged bone becomes structural material or weaponry. The heat-resistant hide becomes armor or shelter. The organs have alchemical and medicinal applications. A Pyrtheran warrior wearing armor from a particular kill can tell you about that kill — not as a boast, but as a relationship. This was a great animal. It fought well. I carry it with me now. The object is a memorial, not a trophy."]}, {"name": "The Pastoral Creatures of Rhylos", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["Volcanic-adapted megafauna that move with the magma flows of the Ignition Rift the way terrestrial animals follow water. Heat-loving, not docile. They tolerate Rhylian herders because the herders are useful — the humans read the magma flows, find safe corridors, and guide the herd through. This is mutualism, not domestication. If the herder gets it wrong, the magma does not care and the animals do not wait.", "The Rhylian pastoral life is not gentle countryside herding. It is walking alongside megafauna through corridors between active volcanic flows that move, and sometimes move fast. There is a reason the Rhylians learned magma dancing — the percussive, grounded movement that influences the flow of magma and shapes stone. They learned it because the alternative was dying. The theology came after, to describe what the necessity had already taught them."]}]}, {"name": "Mythic Creatures", "creatures": [{"name": "Pyralithe", "epithet": "Gonlan of the Upper Sky", "pronunciation": "", "etymology": "", "paragraphs": ["The greater of Pyrthera’s two solar Gonlans. The transcendent flame above."]}, {"name": "Agnivar", "epithet": "Gonlan of the Volcanic Heart", "pronunciation": "", "etymology": "", "paragraphs": ["Lava bones and dragon glass. The volcanic heart of Pyrthera made manifest."]}]}], "blocks": []}, {"label": "Tenebralis", "raw": "VI. TENEBRALIS", "type": "realm", "roots": "Linguistic roots: Akkadian.", "categories": [{"name": "Between Animal And Human", "creatures": [{"name": "Etemmu", "epithet": "The Thing in the Deep", "pronunciation": "eh-TEM-oo", "etymology": "Akkadian etemmu, “spirit/ghost”", "paragraphs": ["A single entity of the same species as the apex things on the surface — a cognitive predator of incomprehensible scale — but this one is inside Tempora. It sits at the summit of the Aesthete hierarchy. To the five hundred thousand Mavarrans of Tempora, the Etemmu is their sovereign — the reason the perimeter holds, the reason the other apex entities on the surface do not enter the cavity. Territorial in the way a predator defends its hunting ground: it does not care about the deer. The deer are its deer.", "The Aesthetes serve the Etemmu because service is the only survivable proximity to it. Its method of predation is cognitive: it unmakes minds, then souls, then bodies, in that order. Every other Mavarran gives the Aesthetes whatever they want because the alternative is the Aesthetes directing that attention downward. No laws are needed. No constitution. No enforcement apparatus. Just the universal understanding that attention flows downward from something that eats minds, and your entire life is organized around not being the thing it notices.", "The foundational lie of Mavarran civilization: the Etemmu is managed by Vex Mavarra. She is the one mind in Tenebralis that never resolves into a fixed image. The Etemmu cannot dominate what it cannot perceive, and Vex is the one thing it has never perceived clearly. The mechanism of forgetting applied at cosmic scale. Their god is real. Their god is powerful. Their god is the reason they survive. And their god does not run anything. Vex runs everything. The god is the mask Vex wears at the scale of an entire civilization. Nobody knows."]}]}, {"name": "Predators", "creatures": [{"name": "Pansirru", "epithet": "The Mirror-Raptor", "pronunciation": "pan-SEER-oo", "etymology": "Akkadian pānu “face” + šerru “to rend,” “face-ripper”", "paragraphs": ["A large, falcon-like predator whose feathers are mirrored on their surface — each one a slightly curved reflective panel. In flight, visually disruptive, scattering and fragmenting light in every direction. When it shrieks, the cry has a documented psychic component: it broadcasts the secret truths of its nearest target into the local air, where they propagate through the Vith’Pani’s rumor networks like atmospheric transmission.", "The Pansirru hunts liars. This is not metaphor. The creature has developed a predatory specialism on a world where deception is the primary social behavior, and the physiology of active deception — elevated stress hormones, micro-tension in the vasculature — registers as prey-signal. Its existence is a genuine structural problem for a civilization built on the Shim’zillai. The Curators monitor its migration patterns. Symposiums relocate when a Pansirru is sighted nearby."]}, {"name": "Sarrith", "epithet": "The Glass-Winged Insects", "pronunciation": "SAR-reeth", "etymology": "Akkadian sartu, “lie”", "paragraphs": ["Glass-winged insects approximately the size of a large moth. Wings are transparent and slightly reflective. They congregate on mirrored surfaces and feed on the emotional residue — specifically insecurity and denied self-knowledge — reflected in the glass. In small numbers, dismissed as a nuisance comparable to mosquitoes. A swarm gathering on a particular mirror is read as an omen: the person reflected is coming apart underneath. Unmasking is approaching. Vulnerability is visible to something. Mavarrans cover mirrors not in use to prevent Sarrith infestation. The practical gesture has acquired its own cultural weight: covered mirrors mean something is being hidden that is not yet ready to be known."]}, {"name": "La’Sumu", "epithet": "The Nameless Things", "pronunciation": "lah-SOO-moo", "etymology": "Akkadian lā “not” + šumu “name,” “the nameless”", "paragraphs": ["Slithering shapes under the fog line. Faster than eye-tracking allows. Smarter than their apparent morphology suggests. Not catalogued. Referenced in whisper. They are the intermediary fauna between Tempora’s manageable transition zone dangers and the incomprehensible things on the surface and in the deep. They come up from below and down from above, testing the perimeter, probing the boundary of the habitable zone. The Luxenfallen perimeter watch — composed entirely of slaves — exists to keep the La’Sumu out."]}]}, {"name": "Mythic Creatures", "creatures": [{"name": "Mushussu", "epithet": "The Shoggoths", "pronunciation": "moo-SHOO-soo", "etymology": "Akkadian, originally a mythical serpent-dragon hybrid", "paragraphs": ["A common population on the surface of Tenebralis. Amorphous masses of dark protoplasm that reform continuously, possessing no fixed shape or size, absorbing and digesting organic matter on contact. Common as deer, if deer were shapeless and all-consuming. The Mushussu are not even close to the most dangerous thing on the surface. They are the baseline wildlife of a world where the baseline is horror."]}, {"name": "The Apex Entities", "epithet": "", "pronunciation": "", "etymology": "", "paragraphs": ["The actual dominant species of Tenebralis. Beings so vast, so cognitively alien, so fundamentally incompatible with mortal perception that seeing one is itself an injury. Not because they attack on sight — because the mortal mind is not built to process what they are. The madness is not a weapon. It is a side effect of proximity, the way radiation is not an attack but simply what happens when you stand too close to something operating at an energy level your biology was never designed to survive.", "These entities will almost certainly never appear on screen. They do their narrative work by existing, not by appearing. A single line in the right moment — someone glancing upward toward the chasm rim and choosing not to explain why — does more work than pages of description. The horror is in the silence around them."]}, {"name": "Noctivex", "epithet": "The Gonlan of Tenebralis", "pronunciation": "", "etymology": "", "paragraphs": ["The Primal Gonlan of Tenebralis. Eyeless, many-winged, coiled in shadows. Vantablack scales. Drinks minds, eclipses all light. Alciel’s maternal inheritance made flesh — the form drawn from his mother Nyx’s domain."]}]}], "blocks": [{"heading": "The Threat Model", "paragraphs": ["From the Sarrith feeding on insecurity to the Pansirru broadcasting secrets to the La’Sumu probing the perimeter to the Mushussu on the surface to the apex entities walking among them to the Etemmu in the deep: the entire ecology of Tenebralis operates on a single gradient. Minds, then souls, then bodies are unmade by whatever perceives them clearly. The Mavarran culture — masks, fluid identity, the Pansilion, the Shim’zillai — is the behavioral adaptation of a prey species that learned to hide from predators that hunt by cognition. Vex Mavarra did not invent deception as a cultural practice. She refined what was already a biological survival strategy against things that would devour any mind they could comprehend."]}]}, {"label": "The Infernal Plague And The Animals", "raw": "VII. THE INFERNAL PLAGUE AND THE ANIMALS", "type": "prose", "roots": "", "categories": [], "blocks": [], "intro": ["The animals and wildlife and even the Gonlan seem to be in mourning — but for what?", "— The State of the Realms", "At the start of Book One, the forces of Hel have been encroaching on the living Realms for several years. Not as a political threat. As a sickness. The animals know. They knew before the people did.", "The Gonlans are in mourning. Every single one — children of Aracice, orphaned by his murder at Point Zero, feeling the sickness spread through worlds their father built and guarded. The divine cascade on Zephyros falters as Aeralithe’s patterns shift. The megafauna of Pyrthera grow restless, migration routes deviating from patterns held for millennia. The deep-water creatures of Thalassor surface more frequently, as if checking on something. The Felicis and Lykons of Ferridane are agitated in ways the Outlands patrols have never recorded.", "And on Zephyros — a world where nothing is supposed to be violent — the corruption comes for the innocent. A Flambelin that used to curl up at the foot of a child’s bed now has something wrong with it. Something in its eyes. Something in the way it moves. Something that makes the child’s mother pull her child away and close the door for the first time ever against a creature that was family.", "The peaceful creatures of a peaceful world can feel the sickness coming, and they have no framework for it. No evolutionary defense against predation, because predation does not exist on Zephyros. When the Plague reaches this world, it does not meet resistance. It meets innocence. And innocence is not armor.", "•  •  •", "This codex is a living document. Pyrtheran fauna await individual species names. The Siren civilization beneath Thalassor’s waves awaits elaboration. The near-human species will receive expanded entries as their narrative roles develop across the nine books."]}]};

const REALM_ACCENT = {
  "Zephyros":"#6f8f7a", "Ferridane":"#b07d3a", "Thalassor":"#3f7da8",
  "Pyrthera":"#bb5436", "Tenebralis":"#7d6aa6"
};
const REALM_GLYPH = {
  "Zephyros":"✶ ⌇ ✶","Ferridane":"◆ ◇ ◆","Thalassor":"≈ ◈ ≈","Pyrthera":"✷ ☀ ✷","Tenebralis":"◢ ◆ ◣"
};
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---- THE TEMPLATE: one creature -> one styled entry. Change this once, all entries reflow. ----
function creatureHTML(c){
  const etym = (c.pronunciation || c.etymology)
    ? `<div class="etym"><span class="pron">${esc(c.pronunciation)}</span>${c.etymology? " — "+esc(c.etymology):""}</div>` : "";
  const body = c.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("");
  return `<article class="creature">
    <div class="plate"><span class="ph">Illustration Plate</span><span class="pn">${esc(c.name)}</span></div>
    <h4>${esc(c.name)}</h4>
    ${c.epithet? `<div class="epithet">${esc(c.epithet)}</div>`:""}
    ${etym}
    <div class="desc">${body}</div>
  </article>`;
}

function render(){
  let n=0, html="";
  for(const s of DATA.sections){
    if(s.type==="prose" && s.label.toLowerCase().includes("foundational")){
      html += `<section class="section-prose"><h2 class="sec-head">${esc(s.label)}</h2><div class="sec-prose">`;
      (s.intro||[]).forEach(p=>html+=`<p>${esc(p)}</p>`);
      for(const b of (s.blocks||[])){
        html+=`<h3>${esc(b.heading)}</h3>`;
        b.paragraphs.forEach((p,i)=>html+=`<p class="${i===0?'lede':''}">${esc(p)}</p>`);
      }
      html += `</div></section>`;
    } else if(s.type==="realm"){
      const acc = REALM_ACCENT[s.label]||"#7a6a4f";
      html += `<section style="--accent:${acc}">
        <div class="realm-divider">
          <div class="kicker">Realm of the Chromatic System</div>
          <h2>${esc(s.label)}</h2>
          <div class="glyph">${REALM_GLYPH[s.label]||"◆"}</div>
          ${s.roots? `<div class="roots">${esc(s.roots)}</div>`:""}
        </div>`;
      for(const cat of s.categories){
        html += `<div class="cat">${esc(cat.name)}</div>`;
        for(const c of cat.creatures){ html+=creatureHTML(c); n++; }
      }
      html += `</section>`;
    } else {
      // other prose sections (e.g. The Infernal Plague)
      html += `<section class="section-prose"><h2 class="sec-head">${esc(s.label)}</h2><div class="sec-prose">`;
      (s.intro||[]).forEach(p=>html+=`<p>${esc(p)}</p>`);
      for(const b of (s.blocks||[])){ html+=`<h3>${esc(b.heading)}</h3>`; b.paragraphs.forEach(p=>html+=`<p>${esc(p)}</p>`);}
      html += `</div></section>`;
    }
  }
  // front matter
  const f = DATA.front.map(x=>x.text);
  const front = `<div class="front">
    <div class="series">${esc(f[0]||"ADVENT OF ULTIMA")}</div>
    <h1>${esc(f[2]||"Nature & Wildlife of the Realms")}</h1>
    <div class="sub">${esc(f[3]||"A Comprehensive Reference")}</div>
    <div class="date">${esc(f[4]||"")}</div>
    <hr class="rule">
    <div class="epi">“${esc((f[5]||"").replace(/^["“]|["”]$/g,""))}”
      <cite>${esc(f[6]||"")}</cite></div>
  </div>`;
  document.getElementById("root").innerHTML = front + html;
  document.getElementById("count").textContent = n;
}

document.querySelectorAll(".bar button[data-skin]").forEach(b=>{
  b.onclick=()=>{
    document.documentElement.dataset.skin=b.dataset.skin;
    document.body.dataset.cap = getComputedStyle(document.documentElement).getPropertyValue('--dropcap').trim()==="0"?"0":"1";
    document.querySelectorAll(".bar button[data-skin]").forEach(x=>x.classList.toggle("on",x===b));
  };
});
render();
document.body.dataset.cap="1";
</script>
