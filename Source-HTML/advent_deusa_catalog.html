<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advent of Ultima — Deusa & Abilities Catalog</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap');

:root {
  --bg-primary: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-hover: #1a1a26;
  --bg-surface: #16161f;
  --text-primary: #e8e6e1;
  --text-secondary: #9a9890;
  --text-tertiary: #5c5a55;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --border-active: rgba(255,255,255,0.2);
  --accent: #8b2d2d;
  --accent-light: #c44040;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Outfit', -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); line-height: 1.6; min-height: 100vh; }
.page { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

header { text-align: center; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
header h1 { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 400; letter-spacing: 0.04em; }
header h1 span { color: var(--accent-light); }
header .subtitle { font-family: var(--font-display); font-size: 1.1rem; font-style: italic; color: var(--text-tertiary); font-weight: 400; letter-spacing: 0.06em; }

.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-tertiary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search-wrap input { width: 100%; padding: 10px 14px 10px 40px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color 0.2s; }
.search-wrap input::placeholder { color: var(--text-tertiary); }
.search-wrap input:focus { border-color: var(--border-active); }

.tier-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.tbtn:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--bg-card); }
.tbtn.active { background: var(--accent); border-color: var(--accent); color: #e8e6e1; }

.count { font-size: 13px; color: var(--text-tertiary); margin-bottom: 1rem; }

.domain-section { margin-bottom: 2.5rem; }
.domain-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.domain-header:hover .domain-title { color: var(--text-primary); }
.domain-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.domain-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.04em; transition: color 0.15s; }
.domain-god { font-family: var(--font-display); font-size: 0.9rem; font-style: italic; color: var(--text-tertiary); }
.domain-count { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }
.domain-chevron { color: var(--text-tertiary); font-size: 14px; transition: transform 0.2s; }
.domain-section.collapsed .domain-chevron { transform: rotate(-90deg); }
.domain-section.collapsed .grid { display: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; opacity: 0; transition: opacity 0.2s; }
.card:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }
.card:hover::before { opacity: 0.5; }
.card.open { border-color: var(--border-active); background: var(--bg-card-hover); }
.card.open::before { opacity: 1; }

.card-top { display: flex; align-items: baseline; gap: 8px; }
.aname { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.atier { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: rgba(255,255,255,0.05); color: var(--text-tertiary); white-space: nowrap; }
.awielder { font-family: var(--font-display); font-size: 12px; font-style: italic; color: var(--text-tertiary); margin-top: 2px; }
.adesc { font-size: 13px; color: var(--text-secondary); margin-top: 10px; line-height: 1.6; font-weight: 300; display: none; }
.card.open .adesc { display: block; }
.adesc .tag { display: inline-block; font-size: 11px; color: var(--text-tertiary); margin-top: 6px; padding: 2px 8px; background: rgba(255,255,255,0.04); border-radius: 4px; letter-spacing: 0.04em; margin-right: 4px; }

footer { text-align: center; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.06em; font-weight: 300; }

@media (max-width: 600px) {
  .page { padding: 2rem 1rem 3rem; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Advent of <span>Ultima</span></h1>
    <div class="subtitle">Deusa &amp; Abilities Catalog &middot; Organized by Divine Domain</div>
  </header>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="q" placeholder="Search abilities, wielders, descriptions...">
    </div>
    <div class="tier-filters" id="tiers"></div>
  </div>
  <div class="count" id="count"></div>
  <div id="out"></div>
  <footer>ADVENT OF ULTIMA &middot; MOIRAI CODEX &middot; DEUSA ARCHITECTURE</footer>
</div>
<script>
const domainColors = {
  "Fire — Hestia":"#c4453a",
  "Water — Salacia":"#3a7bc8",
  "Earth & Metal — Edgerinne / Brokkae":"#b8861b",
  "Air & Wind — Iles":"#4a8a2a",
  "Light — Luxania (Aether)":"#d4a840",
  "Ice & Cold — Glacia":"#7a8fa0",
  "Shadow — Erebus":"#6b5aad",
  "Mind & Memory — Wizaer":"#2a8a6a",
  "Love — Ishtar":"#b84a70",
  "Truth & Law — Ma'at":"#c8a050",
  "Death & Afterlife — Kaos / Thanatos":"#6a6860",
  "Magic Itself — Dozu":"#8a5ab0",
  "Time — Chronos":"#5080a0",
  "Fate — The Moirai / Ananke":"#9a7ab0",
  "Infernal — Hel / Raiwata":"#8a3a1a",
  "Divine Functions — Tier Five":"#2a8a6a",
  "Oinomantic Vintages — Cloud's Inventions":"#3a6090",
  "Gestalt & Invented — Cross-Domain":"#888070"
};

const A = [
  // FIRE
  {n:"Ignis",w:"Uriel",t:"T3",dom:"Fire — Hestia",d:"Pure elemental pyrokinesis at massive capacity. Standard thermodynamic rules apply. More fire costs more myst. Replenishment through Solar Synthesis on Pyrthera, Sacred Braid off-world."},
  {n:"Ifris I",w:"Uriel & Aya",t:"T4",dom:"Fire — Hestia",d:"Invented discipline. Fire-ice closed thermodynamic loop. Exothermic combustion feeds endothermic consumption feeds combustion. Self-sustaining after ignition. The flame is free; precision is expensive."},
  {n:"Ifris II",w:"Uriel",t:"T4+",dom:"Fire — Hestia",d:"The original Ifris loop mutated by Hel. Instant combustion. The hunger of the abyss and the wrath of the Sea of Wrath folded into the circuit. Cost: ignition, and the strength to hold the leash."},
  {n:"Violet Fire / Immolation",w:"Uriel",t:"T5",dom:"Fire — Hestia",d:"Everything burns. Stone, flesh, air. The Atrium of Steelheart reduced to smoking ruin by one man. Post-Hel infernal magic at zero ongoing myst cost — the cost was paid in full through suffering."},
  {n:"Antaka",w:"Sol'Kheret, Fiacre (learned)",t:"T3+",dom:"Fire — Hestia",d:"The capacity to redirect a sun — to collapse the distance between a planet and its star. Six people in the universe hold this power. Nuclear deterrence. Fiacre learned it from Sol'Kheret."},
  {n:"Solar Synthesis",w:"All Pyrtherans",t:"T1",dom:"Fire — Hestia",d:"Converts lethal solar radiation into vitality and myst. The metabolic foundation of Pyrtheran civilization. Off-world, Pyrtherans operate on rations, making the Sacred Braid nutritionally essential."},
  {n:"The Sacred Braid",w:"All Pyrtherans",t:"T2",dom:"Fire — Hestia",d:"Fighting, dancing, lovemaking — three expressions of a single discipline. Not metaphor. Curriculum. Off-world, functions as essential myst replenishment pathway when Solar Synthesis is insufficient."},
  {n:"The Golden Flame",w:"Sol'Kheret, Anberlyn (Yellow Flame)",t:"T3+",dom:"Fire — Hestia",d:"Burns ego, not flesh. The Trial of Flame burns away what is false in a person, leaving only what is true. Anberlyn's Yellow Flame is the same fire."},
  {n:"Pyrokinesis (Pure Expression)",w:"Fire-domain Mystics",t:"T3",dom:"Fire — Hestia",d:"Unilateral creation and control of fire from nothing. The baseline fire-domain Deusa."},
  {n:"Stellar Energy Manipulation",w:"Sol'Kheret, Torchbearers",t:"T3+",dom:"Fire — Hestia",d:"Touching the fire domain at a depth where stellar forces become accessible. The path that leads to Antaka."},
  {n:"Heat Vision",w:"Various",t:"T3",dom:"Fire — Hestia",d:"Eye-channeled thermal projection. Narrow application of the fire domain."},
  {n:"Smoke Manipulation",w:"Various",t:"T3",dom:"Fire — Hestia",d:"Combustion byproduct control. Narrow application."},
  {n:"Ash-Sight",w:"Various",t:"T3",dom:"Fire — Hestia",d:"Derivative perception. Reading heat signatures as spiritual auras carrying the kafer."},

  // WATER
  {n:"Aestus (Water Mastery)",w:"Saint Cloud Sinclair",t:"T3",dom:"Water — Salacia",d:"Control over water in all forms, including within living bodies. Blood manipulation, mist creation, pressurized cutting. On the battlefield, conducted soldiers by manipulating their bloodflow."},
  {n:"Aesta-Mitiga (Healing Manipulation)",w:"Saint Cloud Sinclair",t:"T3",dom:"Water — Salacia",d:"Myst redistribution through fluid medium. Accelerated regeneration or stripping opponents of their ability to heal."},
  {n:"Clairmancy (Portal Control)",w:"Sinclair Dynasty",t:"T3",dom:"Water — Salacia",d:"Hereditary soul-Deusa. The ability to open and control the Clairgates. Revealed to be a stolen Luxanian power. Awakened by the Vintage of the Veil."},
  {n:"Dancaelet Salacia",w:"Saint Cloud Sinclair",t:"T2",dom:"Water — Salacia",d:"Divine water-based martial art. Cloud fights with the fluidity of the ocean itself."},
  {n:"Hydrokinesis (Pure Expression)",w:"Water-domain Mystics",t:"T3",dom:"Water — Salacia",d:"Unilateral creation and control of water. The baseline water-domain Deusa."},
  {n:"Hydromancy",w:"Various Thalassorians",t:"T3",dom:"Water — Salacia",d:"Derivative perception. Experiencing memories held in deep waters. A fisherman who tastes poison in water from twenty yards."},

  // OINOMANTIC VINTAGES
  {n:"Oinomancy",w:"Saint Cloud Sinclair (invented)",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Reverse-engineered the Concordant Path, combined with Aestus. The art of distilling experience, emotion, Deusa, and essence into wine. An entirely new category of power."},
  {n:"Wine of Shared Dreams (Oinos Koines Oneiron)",w:"Cloud / Oinomancers",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Hyper-realistic shared combat simulations. Zero physical risk. Produces the best-trained forces in the cosmos. Technology stolen from Ferridane via Dorado Casanova."},
  {n:"Wine of Shared Horizons (Oinos Koines Horizontes)",w:"Cloud / Oinomancers",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Synchronizes the consciousness of a strike force into a single tactical mind. The ultimate military advantage."},
  {n:"Wine of Shared Fates (Oinos Koines Moiras)",w:"Cloud / Oinomancers",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Liquid covenant. Break the agreement after drinking, and the Krenides inside you reverses into poison."},
  {n:"Vintage of the Veil (Oinos Tes Kalypsos)",w:"Sinclair Dynasty",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Brewed once per generation for the Sinclair heir. Contains the cumulative memory of every preceding Exvisar. Awakens Clairmancy. The Sinclair powder-white hair is the visible residue."},
  {n:"The Concordant Path",w:"Sinclair Dynasty",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"The full memory inheritance of every Sinclair patriarch stored in sacramental wine. Cloud's carries only Titus's memories — not Juno's. The ancestral wisdom does not stop whispering."},
  {n:"Haemoinos (Bloodwine)",w:"Thalassori nobility",t:"T4",dom:"Oinomantic Vintages — Cloud's Inventions",d:"Haima (blood) + oinos (wine). Fortified vintage brewed from Krenides water and soul-elixirs from Luxenfallen myst. To drink haemoinos is to taste a life. The complete corruption of Salacia's gift."},

  // EARTH & METAL
  {n:"Art of the True Name (Transfiguration)",w:"Ferridanian Namers, Crex",t:"T2-T4",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Speak a True Name over a thing and the thing becomes the Name. Reality editing. The original sacred art; 'Transfiguration' is the Axipitre's secular renaming that drained the theology."},
  {n:"True Name: Gold (Un De Octogina)",w:"Crex Falcon Axipitre",t:"T4",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Atomic number 79. Most Namers peak at a coin. Crex transmutes a person every sixth round in combat as a counting mechanism. The distance between a coin and a person is the distance between a stone and a mountain."},
  {n:"True Name: Iron",w:"Ferridanian Namers",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Speak it over a stone. The stone is iron. Not iron-like. Iron. Molecular structure, weight, conductivity — all of it. Instantaneous."},
  {n:"True Name: Static",w:"Ferridanian Namers",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Speak it over Galvaneum. The life drains out. The counter to Living Steel."},
  {n:"True Name: Hollow",w:"Ferridanian Namers",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Severs a Mystic's connection to their power entirely. One of the most feared Names in the Realms."},
  {n:"True Name: [CLASSIFIED] — Galvaneum Creation",w:"Classified",t:"T3+",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Speak it over steel. The steel comes alive. It thinks, regenerates, reforms autonomously. How Living Steel is created. One of Ferridane's most guarded secrets."},
  {n:"Art of the Vital Current (Transfusion)",w:"Ferridanian practitioners",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Channeling essence between things. The art of tending sacred flow became the art of capturing and redirecting power. Stewardship became logistics. Endpoint: soul-batteries."},
  {n:"Art of the Forged Self (Transcension)",w:"Ferridanian warriors",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Integrating materials into living flesh. Soma-Weaving Galvaneum along skeletal system, musculature, and nervous system. The sacred art became self-optimization."},
  {n:"The Heraldic Path",w:"Ferridanian warriors",t:"T2",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Living metal woven into the body, tracing the musculature, catching light. Integration of clan sacred beast characteristics. Biological symbiosis with Galvaneum."},
  {n:"Compressed Technology",w:"Axipitre engineers",t:"T4",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Stores a full powered armor suit in a ring. Axipitre engineering marvel. 'And then they put on the ring.'"},
  {n:"Synthetic Deusas",w:"Axipitre clans",t:"T4",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Manufactured using Crystata. The cosmic lottery broken open, portable, consumable. A genuine theological crime: creating the sacred without the sacred. Tolerated in life, punished in Hel."},
  {n:"True Name: Gun",w:"Crex Falcon Axipitre",t:"T4",dom:"Earth & Metal — Edgerinne / Brokkae",d:"The conceptual Deusa. Kinetic projection severing cause from effect. Air Ripper (soul-less, Crystata-powered) evolves to Ghost Punch (soul-restored, pure myst). A decision and a consequence with nothing in between."},
  {n:"Geokinesis (Pure Expression)",w:"Earth-domain Mystics",t:"T3",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Control over earth, rock, soil, and tectonic forces. The baseline earth-domain Deusa."},
  {n:"Biological Transmutation",w:"Ferridanian bio-engineers",t:"T3",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Altering cellular or biological structure of living beings. Combined with Axipitre engineering, this is how Synthetic Deusas and augmentations get manufactured."},
  {n:"Bio-Tech Manipulation",w:"Axipitre engineers",t:"T3",dom:"Earth & Metal — Edgerinne / Brokkae",d:"Seamlessly fusing biological and technological components. The Axipitre clans' entire engineering tradition expressed as individual power."},

  // AIR & WIND
  {n:"Aero Manipulation / Ventus",w:"Zephyrosian Mystics",t:"T3",dom:"Air & Wind — Iles",d:"Unilateral control of wind and atmospheric pressure. The baseline air-domain Deusa in Zephyrian tradition."},
  {n:"Bio-Weather Manipulation",w:"Stormcallers of Uronoia",t:"T3+",dom:"Air & Wind — Iles",d:"Directing weather phenomena through one's own biological energy. The Stormcallers mimic a fraction of a fraction of Xal-Uron's work."},
  {n:"Harmonic Wind-Barrier Warding",w:"Fiacre Athena Chevalier",t:"T4",dom:"Air & Wind — Iles",d:"Densely layered wind-barriers that resound with healing. A soldier swings a sword and hits her aegis and the air forgives them for it. Harmonic tradition from the Crystal Isles."},
  {n:"Fulguror",w:"Xal-Uron (divine lightning)",t:"T5",dom:"Air & Wind — Iles",d:"The golden lightning that enforces divine law against the gravest sins. Xal-Uron arranges Aeralithe's raw Aetheric energy into this form. The entire Stormcaller tradition is an echo of an echo of an echo."},
  {n:"The Aether (network)",w:"Zephyros (civilization-wide)",t:"System",dom:"Air & Wind — Iles",d:"Radio-frequency model: innumerable simultaneous channels, mind as receiver. Works off-world. Knowledge gardens are live storage. Flowers are self-destructing encrypted dead drops. A two-way medium."},

  // LIGHT
  {n:"Crystaturgy (Hegemony)",w:"Crystalline Hegemony of Luxania",t:"T3",dom:"Light — Luxania (Aether)",d:"The art of giving form and permanence to light and emotion. Structured light channeled through precisely cut Crystata to create stable constructs: memory-records, light-bridges, defensive wards, hard-light tools."},
  {n:"Lex Aeterna (Hegemony)",w:"Crystalline Hegemony",t:"T3",dom:"Light — Luxania (Aether)",d:"A deusa that encodes a law into a Crystata, creating a zone of empathic enforcement. The Eternal Law made literal."},
  {n:"Pathos-Kinesis (Dynasties)",w:"Choral Dynasties of Luxania",t:"T3",dom:"Light — Luxania (Aether)",d:"The deusa of shaping and projecting emotions. The Dynasty art of resonant light. Rukii weaponizes his empathic sense — the same art inverted into a tool for a lone predator."},
  {n:"Symphotheosis (Dynasties)",w:"Choral Dynasties",t:"T4",dom:"Light — Luxania (Aether)",d:"Divinization through Harmony. A ritual where multiple souls temporarily merge for transcendent creativity or problem-solving."},
  {n:"Phonourgy (Dynasties)",w:"Choral Dynasties / Rukii",t:"T3",dom:"Light — Luxania (Aether)",d:"Sound-Working. The art of weaving light into emotion and sound. Rukii is the Silent Phonourge — the absolute rejection of what the Dynasties stood for."},
  {n:"Viatoris Lumen (Navigators)",w:"Astral Navigators of Luxania",t:"T3",dom:"Light — Luxania (Aether)",d:"Traveler's Light. The foundational deusa that allows creation of leylines. The basis of inter-realm travel before the Clairgates."},
  {n:"Aether-Blade (Navigators)",w:"Astral Navigators",t:"T3",dom:"Light — Luxania (Aether)",d:"A personal tool/weapon that performs a localized, short-range Viatoris Lumen cut."},
  {n:"Mnemosyne's Embrace",w:"Luxanian archivists",t:"T3",dom:"Light — Luxania (Aether)",d:"A deusa allowing one to fully experience a memory stored in a Crystata. The basis of the Ancestral Archive."},
  {n:"Light-Based Teleportation",w:"Fiacre Athena Chevalier",t:"T4",dom:"Light — Luxania (Aether)",d:"Navigator lineage expression. Authors her own pathways. Does not require Clairgates. Fiacre reclaims the Navigator legacy through her own expression."},
  {n:"Healing (Light as Renewal)",w:"Fiacre Athena Chevalier",t:"T4",dom:"Light — Luxania (Aether)",d:"Through her own blood and tears. Dynasty resonance expression. Light as Renewal and Life — the fourth Luxanian expression, combining all three Luminacies."},

  // ICE
  {n:"Cryokinesis / The Endothermic Art",w:"Glacian Mystics",t:"T3",dom:"Ice & Cold — Glacia",d:"The entire destroyed Realm of Glacia's magical tradition. Surviving expressions appear in half-Glacian descendants scattered across the Realms."},
  {n:"White Flame (Nihilation)",w:"Anberlyn Lethe Jexus",t:"T4",dom:"Ice & Cold — Glacia",d:"Burns myst, renders Mystics mortal. A Glacian Deusa expressing itself through fire's visual language. She has been doing Glacian magic in a Tenebrali accent her entire life — her mother's heritage."},

  // SHADOW
  {n:"The Shade (Divine Signal Dampening)",w:"Erebus (provided to Tenebralis)",t:"T5",dom:"Shadow — Erebus",d:"Makes Tenebralis invisible to other gods' surveillance. A divine function, not a mortal Deusa. The foundational condition that allows everything Vex builds."},

  // MIND & MEMORY
  {n:"The God-Eyes (Deusaex-Wizaer)",w:"Crex Falcon Axipitre",t:"T5",dom:"Mind & Memory — Wizaer",d:"Total knowledge absorption through eye contact. Deusaex-class power in a mortal body. Ripped from his skull by the Archangels. Restored post-Hel, distributed across two thousand clones."},
  {n:"Oneironautica",w:"Arabella Swain",t:"T3",dom:"Mind & Memory — Wizaer",d:"Induce sleep, project into dreams, reshape inner worlds, alter emotional architecture. The primary Deusa of the Oneironauts of Tenebralis."},
  {n:"Unselfing",w:"Arabella Swain",t:"T4",dom:"Mind & Memory — Wizaer",d:"Secret deusa. Psychological surgery where no one remembers her touch and no one can prove it happened. The epistemological ground beneath Cloud is gone and he does not know it."},
  {n:"Oneiric Architecture",w:"Dorado Casanova (family deusa)",t:"T3",dom:"Mind & Memory — Wizaer",d:"Crafting bespoke shared pocket-realities. The Oneiron — the simulation space where reality dissolves into something more permissive. The Michelangelo to Cloud's Medici."},
  {n:"Memory Erasure",w:"Tenebrali Curators",t:"T3",dom:"Mind & Memory — Wizaer",d:"Removing specific or total memories from a target's mind. The mechanism of forgetting as a personal power. Born with this in Tenebralis: recruited or disappeared."},
  {n:"Emotion Erasure (Apathy)",w:"Various",t:"T3",dom:"Mind & Memory — Wizaer",d:"Complete suppression of emotions in oneself or others. Terrifying in any Realm. Weaponized in Tenebralis. Potentially therapeutic in Zephyros. Direction determines function."},
  {n:"Formless Mind",w:"Various",t:"T3",dom:"Mind & Memory — Wizaer",d:"A mind that cannot be read, controlled, tracked, or defined by others. In Zephyros where the Aether carries truth, deeply unsettling. In Tenebralis, invaluable."},
  {n:"Precognition",w:"Oracles of Zephyros, Algol",t:"T3-T5",dom:"Mind & Memory — Wizaer",d:"The soul interfaces with time rather than an element. Algol exists at a depth of this domain that exceeds the architecture used to classify all other beings."},
  {n:"Encyclopedic Knowledge",w:"Various",t:"T3",dom:"Mind & Memory — Wizaer",d:"A vast internal database of factual information. Not learned — innate. The soul interfaces with recorded information as a medium."},
  {n:"Intuitive Aptitude",w:"Various (esp. Axipitre)",t:"T3",dom:"Mind & Memory — Wizaer",d:"Instantly understanding how complex systems or mechanics work by observation. An Axipitre engineer born with this is worth their weight in Crystata."},
  {n:"Efficacy Intuition",w:"Various",t:"T3",dom:"Mind & Memory — Wizaer",d:"Knowing exactly how effective any action, plan, or tool will be before attempting it. A battlefield commander's dream Deusa."},
  {n:"Detail Detection",w:"Various",t:"T3",dom:"Mind & Memory — Wizaer",d:"Perceiving every microscopic, hidden, or out-of-place detail. Law enforcement, security, quality control, espionage."},

const domainOrder = Object.keys(domainColors);
const allTiers = [...new Set(A.map(a=>a.t))].sort();
let activeTier = "All";
let openCard = null;
let collapsedDomains = new Set();

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  let filtered = A.filter(a => {
    if (activeTier !== "All" && a.t !== activeTier) return false;
    if (q && !a.n.toLowerCase().includes(q) && !a.w.toLowerCase().includes(q) && !a.d.toLowerCase().includes(q) && !a.dom.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = filtered.length + " abilit" + (filtered.length !== 1 ? "ies" : "y") + " across " + new Set(filtered.map(a=>a.dom)).size + " domains";
  const grouped = {};
  filtered.forEach(a => { if (!grouped[a.dom]) grouped[a.dom] = []; grouped[a.dom].push(a); });
  let h = "";
  domainOrder.forEach(dom => {
    if (!grouped[dom]) return;
    const dc = domainColors[dom];
    const collapsed = collapsedDomains.has(dom);
    const parts = dom.split(" — ");
    h += '<div class="domain-section' + (collapsed ? ' collapsed' : '') + '" data-dom="' + dom + '">';
    h += '<div class="domain-header" data-dom="' + dom + '"><span class="domain-dot" style="background:' + dc + '"></span>';
    h += '<span class="domain-title">' + parts[0] + '</span>';
    if (parts[1]) h += '<span class="domain-god">' + parts[1] + '</span>';
    h += '<span class="domain-count">' + grouped[dom].length + '</span>';
    h += '<span class="domain-chevron">&#9662;</span></div>';
    h += '<div class="grid">';
    grouped[dom].forEach(a => {
      const isOpen = openCard === a.n + a.w;
      h += '<div class="card' + (isOpen ? ' open' : '') + '" data-key="' + (a.n + a.w).replace(/"/g,'&quot;') + '" style="--dc:' + dc + '">';
      h += '<div style="position:absolute;top:0;left:0;width:3px;height:100%;background:' + dc + ';opacity:' + (isOpen ? '1' : '0') + ';transition:opacity .2s"></div>';
      h += '<div class="card-top"><span class="aname">' + a.n + '</span><span class="atier">' + a.t + '</span></div>';
      h += '<div class="awielder">' + a.w + '</div>';
      h += '<div class="adesc">' + a.d + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
  });
  if (!filtered.length) h = '<div style="color:var(--text-tertiary);text-align:center;padding:3rem;font-family:var(--font-display);font-size:1.1rem;font-style:italic">No abilities found</div>';
  document.getElementById("out").innerHTML = h;
  bindEvents();
}

function bindEvents() {
  document.querySelectorAll(".domain-header").forEach(dh => {
    dh.addEventListener("click", () => {
      const dom = dh.getAttribute("data-dom");
      if (collapsedDomains.has(dom)) collapsedDomains.delete(dom); else collapsedDomains.add(dom);
      render();
    });
  });
  document.querySelectorAll(".card").forEach(card => {
    const key = card.getAttribute("data-key");
    card.addEventListener("click", e => { e.stopPropagation(); openCard = openCard === key ? null : key; render(); });
    card.addEventListener("mouseenter", () => { const b = card.querySelector("div:first-child"); if (b && !card.classList.contains("open")) b.style.opacity = "0.5"; });
    card.addEventListener("mouseleave", () => { const b = card.querySelector("div:first-child"); if (b && !card.classList.contains("open")) b.style.opacity = "0"; });
  });
}

function initTiers() {
  const tiers = ["All","T1","T2","T2-T4","T3","T3+","T3-T5","T4","T4+","T4-T5","T5","T5+","Beyond","Infernal","System"];
  let h = "";
  tiers.forEach(t => { h += '<button class="tbtn' + (t === "All" ? ' active' : '') + '" data-t="' + t + '">' + t + '</button>'; });
  const el = document.getElementById("tiers");
  el.innerHTML = h;
  el.querySelectorAll(".tbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTier = btn.getAttribute("data-t");
      openCard = null;
      el.querySelectorAll(".tbtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });
}

document.getElementById("q").addEventListener("input", () => { openCard = null; render(); });
initTiers();
render();
</script>
